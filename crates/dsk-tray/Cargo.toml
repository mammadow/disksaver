[package]
name = "dsk-tray"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Lightweight Windows system-tray agent for DiskSaver low-space alerts and scheduled safe cleanup"

[[bin]]
name = "disksaver-tray"
path = "src/main.rs"

[dependencies]
dsk-core = { path = "../dsk-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
