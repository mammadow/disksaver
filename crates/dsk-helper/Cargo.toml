[package]
name = "dsk-helper"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "On-demand elevated IPC helper for DiskSaver over hardened Windows named pipes"

[[bin]]
name = "dsk-helper"
path = "src/main.rs"

[dependencies]
dsk-core = { path = "../dsk-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.17"

