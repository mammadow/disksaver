regenerable = true
requires_admin = false
explain = "Temporary folders left by legacy component initialization via native Disk Cleanup handler"
method = { kind = "os_handler", handler_key = "Active Setup Temp Folders" }

[[rule]]
id = "os.vc.temp_sync"
name = "Temporary Sync Files"
category = "system"
tier = "safe"
regenerable = true
requires_admin = false
explain = "Temporary sync files via native Disk Cleanup handler"
method = { kind = "os_handler", handler_key = "Temporary Sync Files" }

[[rule]]
id = "os.vc.diag_data"
name = "Diagnostic Data Viewer Database Files"
category = "system"
tier = "safe"
regenerable = true
requires_admin = false
explain = "Diagnostic data viewer local cache via native Disk Cleanup handler"
method = { kind = "os_handler", handler_key = "Diagnostic Data Viewer database files" }

[[rule]]
id = "os.vc.recycle_bin"
name = "Recycle Bin"
category = "system"
tier = "safe"
regenerable = false
requires_admin = false
default_enabled = false
explain = "Empty deleted items from the Recycle Bin (opt-in only)"
method = { kind = "os_handler", handler_key = "Recycle Bin" }

[[rule]]
id = "sys.temp.windows"
name = "Windows System Temp"
category = "system"
tier = "safe"
regenerable = true
requires_admin = true
paths = ["%SystemRoot%\\Temp"]
min_age_days = 2
explain = "Temporary files created by system services older than 2 days"
method = { kind = "delete_older_than" }

[[rule]]
id = "sys.temp.system"
name = "System Temp Folder"
category = "system"
tier = "safe"
regenerable = true
requires_admin = true
paths = ["%SystemRoot%\\SystemTemp"]
min_age_days = 2
explain = "Secondary system temporary folder older than 2 days"
method = { kind = "delete_older_than" }

[[rule]]
id = "sys.temp.user"
name = "User Temp Files"
category = "system"
tier = "safe"
regenerable = true
requires_admin = false
paths = ["%TEMP%"]
min_age_days = 2
explain = "User temporary folder files older than 2 days"
method = { kind = "delete_older_than" }

[[rule]]
id = "sys.dumps.memory"
name = "Kernel Reports and Minidumps"
category = "system"
tier = "safe"
regenerable = true
requires_admin = true
paths = ["%SystemRoot%\\LiveKernelReports", "%SystemRoot%\\Minidump"]
min_age_days = 7
explain = "Kernel crash minidumps and live reports older than 7 days"
method = { kind = "delete_older_than" }

[[rule]]
id = "sys.wer"
name = "System Windows Error Reporting"
category = "system"
tier = "safe"
regenerable = true
requires_admin = true
paths = [
    "%ProgramData%\\Microsoft\\Windows\\WER\\ReportArchive",
    "%ProgramData%\\Microsoft\\Windows\\WER\\ReportQueue",
    "%ProgramData%\\Microsoft\\Windows\\WER\\Temp",
]
min_age_days = 2
explain = "System-level Windows error reporting archives and queued reports older than 2 days"
method = { kind = "delete_older_than" }

[[rule]]
id = "sys.user.crashdumps"
name = "User Crash Dumps"
category = "system"
tier = "safe"
regenerable = true
requires_admin = false
paths = ["%LOCALAPPDATA%\\CrashDumps"]
min_age_days = 2
explain = "Application crash dumps in user profile older than 2 days"
method = { kind = "delete_older_than" }

[[rule]]
id = "sys.cbs.logs"
name = "Component-Based Servicing Logs"
category = "system"
tier = "safe"
regenerable = true
requires_admin = true
paths = ["%SystemRoot%\\Logs\\CBS"]
min_age_days = 14
preconditions = { exclude_names = ["CBS.log"] }
explain = "Historical CBS servicing logs and persist archives older than 14 days, preserving active CBS.log"
method = { kind = "delete_older_than" }

[[rule]]
id = "sys.panther.logs"
name = "Panther and Servicing Logs"
category = "system"
tier = "safe"
regenerable = true
requires_admin = true
paths = [
    "%SystemRoot%\\Panther",
    "%SystemRoot%\\Logs\\DISM",
    "%SystemRoot%\\Logs\\WindowsUpdate",
]
min_age_days = 30
explain = "Windows installation, DISM, and update logs older than 30 days"
method = { kind = "delete_older_than" }

[[rule]]
id = "sys.drivers.leftovers"
name = "Driver Installer Leftovers"
category = "system"
tier = "safe"
regenerable = true
requires_admin = true
paths = ["%SystemDrive%\\NVIDIA", "%SystemDrive%\\AMD", "%SystemDrive%\\Intel"]
explain = "Extracted installer leftovers on system drive root created during driver updates"
method = { kind = "delete_contents" }

[[rule]]
id = "sys.winsxs.cleanup"
name = "Component Store Cleanup"
category = "system"
tier = "review"
regenerable = true
requires_admin = true
default_enabled = false
explain = "Windows Component Store (WinSxS) cleanup via DISM (/StartComponentCleanup)"
method = { kind = "dism_component_cleanup", reset_base = false }

[[rule]]
id = "sys.winsxs.resetbase"
name = "Component Store ResetBase"
category = "system"
tier = "advanced"
regenerable = false
requires_admin = true
default_enabled = false
explain = "Windows Component Store resetbase via DISM (/ResetBase) - frees significant space but makes installed updates irreversible"
method = { kind = "dism_component_cleanup", reset_base = true }

[[rule]]
id = "sys.driverstore.orphans"
name = "Driver Store Superseded Packages"
category = "system"
tier = "review"
regenerable = true
requires_admin = true
default_enabled = false
explain = "Prunes superseded non-active device drivers via pnputil, retaining currently bound drivers and newest rollback version"
method = { kind = "driver_store_prune" }

[[rule]]
id = "sys.windows.old"
name = "Previous Windows Installations"
category = "system"
tier = "review"
regenerable = false
requires_admin = true
default_enabled = false
explain = "Previous Windows installations (Windows.old) via native Disk Cleanup handler"
method = { kind = "os_handler", handler_key = "Previous Installations" }

