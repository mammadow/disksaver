# System cleanup rules and curated Windows VolumeCaches handlers

[[rule]]
id = "os.vc.update_cleanup"
name = "Update Cleanup"
category = "system"
tier = "safe"
regenerable = true
requires_admin = true
explain = "Windows Update component store cleanup via native Disk Cleanup handler"
method = { kind = "os_handler", handler_key = "Update Cleanup" }

