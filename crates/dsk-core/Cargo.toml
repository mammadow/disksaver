[package]
name = "dsk-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Core Windows NTFS/Win32 disk analysis, TOCTOU-safe cleanup, reclaim ledger, optimizer, and verified video compression library"

[dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_UI_LegacyWindowsEnvironmentFeatures",
    "Win32_System_Registry",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Power",
    "Win32_System_RestartManager",
    "Win32_System_Pipes",
    "Win32_System_Restore",
    "Win32_System_RemoteDesktop",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_WindowsProgramming",
    "Win32_Storage_CloudFilters",
    "Win32_Storage_Compression",
    "Win32_Storage_EnhancedStorage",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
] }
windows-core = "0.62"
blake3 = { version = "1.6", features = ["rayon"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
rayon = "1.10"
crossbeam-channel = "0.5"
rustc-hash = "2.1"
bitflags = "2.8"
smallvec = "1.14"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.2"
rusqlite = { version = "0.41", features = ["bundled"] }
zstd = "0.13"

[dev-dependencies]
proptest = "1.6"
tempfile = "3.17"
