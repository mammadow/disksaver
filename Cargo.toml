[workspace]
resolver = "3"
members = [
    "crates/*",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Elnur Mammadov"]
repository = "https://github.com/mammadow/disksaver"
rust-version = "1.95"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"
